name: Build Chunk Capture Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create all the mod files
        run: |
          mkdir -p src/main/java/com/example/chunkcapture
          mkdir -p src/main/java/com/example/chunkcapture/mixin
          mkdir -p src/main/resources/assets/chunkcapture/lang

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  maven { url = uri("https://maven.fabricmc.net/") }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.3
          loader_version=0.18.1
          fabric_version=0.141.6+1.21.11
          mod_version=1.0.0
          maven_group=com.example.chunkcapture
          archives_base_name=chunkcapture
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }
          EOF

          cat > src/main/resources/fabric.mod.json << 'EOF'
          {
            "schemaVersion": 1,
            "id": "chunkcapture",
            "version": "${version}",
            "name": "Chunk Capture",
            "description": "Stops chunks from being thrown away, so a world downloader can save everything that was ever loaded.",
            "environment": "client",
            "license": "CC0-1.0",
            "entrypoints": {
              "client": [
                "com.example.chunkcapture.ChunkCapture"
              ]
            },
            "mixins": [
              "chunkcapture.mixins.json"
            ],
            "depends": {
              "fabricloader": ">=0.18.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat > src/main/resources/assets/chunkcapture/lang/en_us.json << 'EOF'
          {
            "key.chunkcapture.toggle": "Toggle Chunk Capture"
          }
          EOF

          cat > src/main/resources/chunkcapture.mixins.json << 'EOF'
          {
            "required": true,
            "package": "com.example.chunkcapture.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "ChunkUnloadMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EOF

          cat > src/main/java/com/example/chunkcapture/CaptureState.java << 'EOF'
          package com.example.chunkcapture;

          // One on/off switch, shared by the keybind and the mixin.
          public class CaptureState {

              private static boolean capturing = false;

              public static boolean isCapturing() {
                  return capturing;
              }

              public static void toggle() {
                  capturing = !capturing;
              }

              public static void setCapturing(boolean value) {
                  capturing = value;
              }
          }
          EOF

          cat > src/main/java/com/example/chunkcapture/ChunkCapture.java << 'EOF'
          package com.example.chunkcapture;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          // K turns capture on and off, and tells you in chat which it is.
          public class ChunkCapture implements ClientModInitializer {

              private static KeyBinding toggleKey;

              @Override
              public void onInitializeClient() {
                  toggleKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.chunkcapture.toggle",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_K,
                          KeyBinding.Category.MISC
                  ));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (toggleKey.wasPressed()) {
                          CaptureState.toggle();
                          tell(client, CaptureState.isCapturing()
                                  ? "Chunk Capture ON - chunks will be kept"
                                  : "Chunk Capture OFF");
                      }
                  });
              }

              private static void tell(MinecraftClient client, String message) {
                  if (client.player != null) {
                      client.player.sendMessage(Text.literal(message), false);
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/chunkcapture/mixin/ChunkUnloadMixin.java << 'EOF'
          package com.example.chunkcapture.mixin;

          import com.example.chunkcapture.CaptureState;
          import net.minecraft.client.network.ClientPlayNetworkHandler;
          import net.minecraft.network.packet.s2c.play.UnloadChunkS2CPacket;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          // While capture is on, ignore every "throw this chunk away" message.
          // Chunks then pile up instead of vanishing, so a world downloader
          // can save all of them.
          @Mixin(ClientPlayNetworkHandler.class)
          public class ChunkUnloadMixin {

              @Inject(method = "onUnloadChunk", at = @At("HEAD"), cancellable = true)
              private void chunkcapture$keepChunk(UnloadChunkS2CPacket packet, CallbackInfo ci) {
                  if (CaptureState.isCapturing()) {
                      ci.cancel();
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Make the Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.2.1
          chmod +x gradlew

      - name: Build the mod
        run: ./gradlew build --stacktrace

      - name: Upload the finished mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chunkcapture-mod
          path: build/libs/*.jar

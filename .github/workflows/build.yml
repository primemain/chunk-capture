name: Build Chunk Capture Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create all the mod files
        run: |
          mkdir -p src/main/java/com/example/chunkcapture
          mkdir -p src/main/resources/assets/chunkcapture/lang

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  maven { url = uri("https://maven.fabricmc.net/") }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.3
          loader_version=0.18.1
          fabric_version=0.141.6+1.21.11
          mod_version=2.0.0
          maven_group=com.example.chunkcapture
          archives_base_name=chunkcapture
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }
          EOF

          cat > src/main/resources/fabric.mod.json << 'EOF'
          {
            "schemaVersion": 1,
            "id": "chunkcapture",
            "version": "${version}",
            "name": "Chunk Capture",
            "description": "Copies every chunk that loads during a replay into a saved world, so nothing is lost when the replay moves on.",
            "environment": "client",
            "license": "CC0-1.0",
            "entrypoints": {
              "client": [
                "com.example.chunkcapture.ChunkCapture"
              ]
            },
            "depends": {
              "fabricloader": ">=0.18.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat > src/main/resources/assets/chunkcapture/lang/en_us.json << 'EOF'
          {
            "key.chunkcapture.toggle": "Toggle Chunk Capture"
          }
          EOF

          cat > src/main/java/com/example/chunkcapture/CaptureState.java << 'EOF'
          package com.example.chunkcapture;

          import java.util.HashSet;
          import java.util.Set;
          import net.minecraft.util.math.ChunkPos;

          // The on/off switch, plus the list of chunks already written so the
          // same chunk is not saved over and over as the replay plays.
          public class CaptureState {

              private static boolean capturing = false;
              private static final Set<ChunkPos> saved = new HashSet<>();

              public static boolean isCapturing() {
                  return capturing;
              }

              public static void toggle() {
                  capturing = !capturing;
              }

              public static boolean alreadySaved(ChunkPos pos) {
                  return saved.contains(pos);
              }

              public static void markSaved(ChunkPos pos) {
                  saved.add(pos);
              }

              public static int savedCount() {
                  return saved.size();
              }

              public static void clear() {
                  saved.clear();
              }
          }
          EOF

          cat > src/main/java/com/example/chunkcapture/ChunkWriter.java << 'EOF'
          package com.example.chunkcapture;

          import java.io.DataOutputStream;
          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import net.minecraft.SharedConstants;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.nbt.NbtCompound;
          import net.minecraft.nbt.NbtIo;
          import net.minecraft.nbt.NbtList;
          import net.minecraft.util.math.ChunkPos;
          import net.minecraft.world.chunk.WorldChunk;

          // Writes each captured chunk out as its own small NBT file under
          // .minecraft/chunkcapture/<name>/. A separate step turns the pile
          // into a real world; keeping them as plain files first means a
          // crash halfway through never loses what was already captured.
          public class ChunkWriter {

              private static Path folder = null;

              public static Path folder() {
                  if (folder == null) {
                      Path base = MinecraftClient.getInstance().runDirectory
                              .toPath().resolve("chunkcapture");
                      folder = base.resolve("capture-" + System.currentTimeMillis());
                      try {
                          Files.createDirectories(folder);
                      } catch (IOException e) {
                          e.printStackTrace();
                      }
                  }
                  return folder;
              }

              public static void reset() {
                  folder = null;
              }

              public static void write(WorldChunk chunk) {
                  ChunkPos pos = chunk.getPos();

                  NbtCompound root = new NbtCompound();
                  root.putInt("DataVersion", SharedConstants.getGameVersion().dataVersion().id());
                  root.putInt("xPos", pos.x);
                  root.putInt("zPos", pos.z);
                  root.putInt("yPos", chunk.getBottomY() >> 4);
                  root.putString("Status", "minecraft:full");

                  NbtList sections = new NbtList();
                  var codec = net.minecraft.world.chunk.ChunkSection.CODEC;

                  for (int i = 0; i < chunk.getSectionArray().length; i++) {
                      var section = chunk.getSectionArray()[i];
                      NbtCompound sectionTag = new NbtCompound();
                      sectionTag.putByte("Y", (byte) (chunk.sectionIndexToCoord(i)));

                      NbtCompound blocks = BlockPaletteWriter.write(section);
                      if (blocks != null) {
                          sectionTag.put("block_states", blocks);
                      }
                      sections.add(sectionTag);
                  }
                  root.put("sections", sections);

                  Path file = folder().resolve("c." + pos.x + "." + pos.z + ".nbt");
                  try (DataOutputStream out = new DataOutputStream(
                          Files.newOutputStream(file))) {
                      NbtIo.writeCompressed(root, out);
                  } catch (IOException e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/chunkcapture/BlockPaletteWriter.java << 'EOF'
          package com.example.chunkcapture;

          import net.minecraft.block.BlockState;
          import net.minecraft.nbt.NbtCompound;
          import net.minecraft.nbt.NbtList;
          import net.minecraft.nbt.NbtString;
          import net.minecraft.registry.Registries;
          import net.minecraft.world.chunk.ChunkSection;

          // Turns one 16x16x16 slice of a chunk into the palette + index
          // layout that Minecraft world files use.
          public class BlockPaletteWriter {

              public static NbtCompound write(ChunkSection section) {
                  if (section == null) return null;

                  java.util.List<BlockState> palette = new java.util.ArrayList<>();
                  java.util.Map<BlockState, Integer> lookup = new java.util.HashMap<>();
                  long[] indices = new long[4096];

                  int at = 0;
                  for (int y = 0; y < 16; y++) {
                      for (int z = 0; z < 16; z++) {
                          for (int x = 0; x < 16; x++) {
                              BlockState state = section.getBlockState(x, y, z);
                              Integer id = lookup.get(state);
                              if (id == null) {
                                  id = palette.size();
                                  palette.add(state);
                                  lookup.put(state, id);
                              }
                              indices[at++] = id;
                          }
                      }
                  }

                  NbtList paletteTag = new NbtList();
                  for (BlockState state : palette) {
                      NbtCompound entry = new NbtCompound();
                      entry.putString("Name",
                              Registries.BLOCK.getId(state.getBlock()).toString());

                      if (!state.getProperties().isEmpty()) {
                          NbtCompound props = new NbtCompound();
                          for (var property : state.getProperties()) {
                              props.put(property.getName(),
                                      NbtString.of(name(state, property)));
                          }
                          entry.put("Properties", props);
                      }
                      paletteTag.add(entry);
                  }

                  NbtCompound blocks = new NbtCompound();
                  blocks.put("palette", paletteTag);

                  if (palette.size() > 1) {
                      int bits = Math.max(4, 32 - Integer.numberOfLeadingZeros(palette.size() - 1));
                      int perLong = 64 / bits;
                      long[] packed = new long[(4096 + perLong - 1) / perLong];

                      for (int i = 0; i < 4096; i++) {
                          int slot = i / perLong;
                          int offset = (i % perLong) * bits;
                          packed[slot] |= (indices[i] & ((1L << bits) - 1)) << offset;
                      }
                      blocks.putLongArray("data", packed);
                  }

                  return blocks;
              }

              @SuppressWarnings({ "unchecked", "rawtypes" })
              private static String name(BlockState state,
                                         net.minecraft.state.property.Property property) {
                  return property.name(state.get(property));
              }
          }
          EOF

          cat > src/main/java/com/example/chunkcapture/ChunkCapture.java << 'EOF'
          package com.example.chunkcapture;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientChunkEvents;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          // K starts and stops capture. While it is on, every chunk that
          // loads gets written out straight away, so chunks that later
          // disappear are already safely on disk.
          public class ChunkCapture implements ClientModInitializer {

              private static KeyBinding toggleKey;
              private static int announceTimer = 0;

              @Override
              public void onInitializeClient() {
                  toggleKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.chunkcapture.toggle",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_K,
                          KeyBinding.Category.MISC
                  ));

                  ClientChunkEvents.CHUNK_LOAD.register((world, chunk) -> {
                      if (!CaptureState.isCapturing()) return;
                      if (CaptureState.alreadySaved(chunk.getPos())) return;

                      CaptureState.markSaved(chunk.getPos());
                      ChunkWriter.write(chunk);
                  });

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (toggleKey.wasPressed()) {
                          CaptureState.toggle();

                          if (CaptureState.isCapturing()) {
                              CaptureState.clear();
                              ChunkWriter.reset();
                              tell(client, "Chunk Capture ON - saving to "
                                      + ChunkWriter.folder().getFileName());
                          } else {
                              tell(client, "Chunk Capture OFF - "
                                      + CaptureState.savedCount() + " chunks saved");
                          }
                      }

                      if (CaptureState.isCapturing()) {
                          announceTimer++;
                          if (announceTimer >= 200) {
                              announceTimer = 0;
                              tell(client, CaptureState.savedCount() + " chunks captured");
                          }
                      }
                  });
              }

              private static void tell(MinecraftClient client, String message) {
                  if (client.player != null) {
                      client.player.sendMessage(Text.literal(message), false);
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Make the Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.2.1
          chmod +x gradlew

      - name: Build the mod
        run: ./gradlew build --stacktrace

      - name: Upload the finished mod jar
        uses: actions/upload-artifact@v4
        with:
          name: chunkcapture-mod
          path: build/libs/*.jar
